<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Data Extraction</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 320px;
        height: 400px;
        background: linear-gradient(135deg, #4285F4 0%, #34A853 100%);
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: rgba(255,255,255,0.1);
        border-radius: 16px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        padding: 32px 24px 24px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 90%;
        max-width: 280px;
      }
      .logo {
        width: 64px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 12px;
        color: #fff;
        letter-spacing: 1px;
      }
      .login-btn {
        background: #fff;
        color: #4285F4;
        border: none;
        border-radius: 24px;
        padding: 12px 32px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 18px;
        box-shadow: 0 2px 8px rgba(66,133,244,0.12);
        display: flex;
        align-items: center;
        transition: background 0.2s, color 0.2s;
      }
      .login-btn:hover {
        background: #e8f0fe;
      }
      .google-icon {
        width: 22px;
        height: 22px;
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img class="logo" src="https://www.gstatic.com/images/branding/product/1x/mail_48dp.png" alt="Gmail Logo">
      <h1>Gmail Data Extension</h1>
      <button class="login-btn" id="loginBtn" ">
        <img class="google-icon" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google icon">
        Login with Gmail
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
